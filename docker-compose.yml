version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sap-logistics-hub:latest
    container_name: logistics-hub
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      # Persist uploads (signatures, photos) between restarts
      - ./backend/uploads:/app/backend/uploads
      - ./backend/logs:/app/backend/logs
    networks:
      - logistics-net
    # Run migrations on startup before server starts
    command: sh -c "node backend/src/db/migrate.js && node backend/src/server.js"

networks:
  logistics-net:
    driver: bridge

